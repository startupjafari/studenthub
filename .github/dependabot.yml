# Обновления зависимостей и GitHub Actions.
#
# Зачем. Уязвимость в fastify < 5.12.1 (подделка X-Forwarded-* при trustProxy — ровно тот
# механизм, на котором держится троттлинг логина по IP) прожила в репозитории незамеченной
# до ручного аудита. Пакеты протухают молча, и единственный способ узнать об этом вовремя —
# чтобы кто-то регулярно смотрел. Пусть смотрит бот.
#
# Раз в неделю и пачками по экосистемам: ежедневный поток PR'ов в репозитории с одним
# автором не читают, а закрывают не глядя.
#
# Про target-branch. Без него бот открывает PR в ветку по умолчанию — main, а работа идёт
# в develop и уходит в main выпуском. PR в main обновлял зависимости в обход develop: после
# слияния ветки расходились, а сам PR проверялся против устаревшего кода. Поэтому у каждого
# набора — develop. Алерты безопасности при этом по-прежнему считаются по main и закрываются
# выпуском develop → main.
#
# Про cooldown. У каждого набора обновлений стоит выдержка в неделю: бот не возьмёт
# версию, опубликованную только что. Скомпрометированную версию — подменённый пакет в
# npm, переписанный тег экшена, пересобранный базовый образ — обнаруживают не мгновенно:
# её сначала публикуют, какое-то время раздают, и только потом она попадает в advisory и
# исчезает из реестра. Неделя означает, что в это окно бот не принесёт её нам в PR.
version: 2
updates:
  # Патчи и минорные версии — одной группой: их смотрят по changelog'у пачкой, а не по
  # одному PR на пакет. Мажорные приходят отдельными PR: там нужен разбор.
  - package-ecosystem: npm
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Almaty
    # Выдержка перед тем, как взять свежую версию. Подмена пакета в npm обнаруживается
    # не мгновенно: вредоносную версию публикуют, её какое-то время скачивают, и только
    # потом она попадает в advisory и исчезает из реестра. Неделя ожидания означает, что
    # бот не принесёт такую версию в тот же день, когда её опубликовали.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      # Тип и scope латиницей, описание по-русски — как в остальной истории (AGENTS.md).
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      patch-and-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Мажорные Next/React/NestJS/Prisma переезжают вместе с кодом, а не по PR от бота:
      # они всегда тянут правки в приложении. Безопасность здесь ни при чём — эти четыре
      # обновляются руками и осознанно.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/client'
        update-types: [version-update:semver-major]

  # Базовые образы всех Dockerfile (node:24-alpine, nginx:1.27-alpine, alpine и mediamtx у
  # ретранслятора камер). Причина та же, что в шапке файла: обновления приходят молча, а в
  # базовом образе живёт вся системная часть контейнера. Раз в месяц — как у actions: чаще
  # их всё равно не читают.
  - package-ecosystem: docker
    target-branch: develop
    directories:
      - /apps/api
      - /apps/web
      - /apps/landing
      - /apps/mini-app
      - /apps/camera-agent
      - /docker/media-relay
    schedule:
      interval: monthly
    # Выдержка в неделю — см. «Про cooldown» в шапке файла.
    cooldown:
      default-days: 7
    # Мажорную версию Node бот не приносит: ветку выбирает человек, и выбирает Active LTS.
    # Иначе получается PR #282 — бот поднял api с node:20-alpine до node:26-alpine, в 26-й
    # нет corepack, сборка легла, и образ прода чинился уже постфактум. Смена мажора Node
    # задевает и Dockerfile, и setup-node, и локальную машину — это отдельная задача.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps)'

  # Готовые образы прод-стека (nginx, certbot в docker/prod/compose.yml) — та же причина.
  # docker/shared/infra.yml (postgres, redis, pgsty/minio) бот не видит: он читает только
  # файлы с compose в имени.
  - package-ecosystem: docker-compose
    target-branch: develop
    directory: /docker/prod
    schedule:
      interval: monthly
    # Выдержка в неделю — см. «Про cooldown» в шапке файла.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'

  # Actions пришпилены по мажорной версии (actions/checkout@v4) и сами не обновляются.
  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule:
      interval: monthly
    # Выдержка в неделю — см. «Про cooldown» в шапке файла.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
