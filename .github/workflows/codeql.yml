name: codeqlScan

# СХЕМА ПРОГОНА
#
#   push в develop / main ─┐
#   pull request в main ───┼─► CodeQL собирает базу по коду и прогоняет по ней запросы:
#   понедельник, 03:17 UTC ┘
#
#       javascript-typescript .. весь код apps/ и packages/
#       actions ................ сами файлы .github/workflows
#
#   Находки уезжают во вкладку Security → Code scanning, а не в лог прогона.
#
# Зачем это нужно отдельно от линта и тестов. ESLint смотрит на файл, CodeQL — на поток
# данных через весь проект: куда в итоге попадает значение из тела запроса, доходит ли оно
# до конкатенации SQL, до пути в файловой системе, до редиректа. Такие дыры не видны ни
# типам, ни тестам: код корректен, просто доверяет не тому источнику.
#
# Почему отдельным прогоном, а не job'ой в ci.yml: анализ идёт несколько минут и имеет
# собственное расписание. Еженедельный прогон не дублирует проверку кода, который не
# менялся: обновляются сами наборы запросов CodeQL, и то, что было чистым в прошлый раз,
# в следующий может оказаться находкой.
#
# Платить не нужно: репозиторий публичный, для таких CodeQL бесплатен.
#
# Язык `actions` — это анализ самих workflow. С zizmor из ci.yml он не дублируется:
# zizmor проверяет конфигурацию (права, пришпиленные версии, подстановки), CodeQL —
# поток данных внутри выражений и скриптов.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  schedule:
    # Понедельник, 03:17 UTC — это 09:17 по Алматы, то есть находки лежат готовыми
    # к началу рабочей недели. Минуты не круглые намеренно: в начале часа GitHub
    # запускает расписания всего мира, и очередь на старте заметно длиннее.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Анализ · ${{ matrix.language }}
    runs-on: ubuntu-24.04
    # Анализ укладывается в ~10 минут. Потолок — против зависшей сборки базы.
    timeout-minutes: 40

    permissions:
      # Единственное место во всём репозитории, где токену нужна запись: сюда CodeQL
      # кладёт результаты анализа. Права выданы job'у, а не всему прогону.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - name: Забрать код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # build-mode: none — для интерпретируемых языков CodeQL строит базу прямо по
      # исходникам, собирать проект не нужно. Сборка здесь не только лишние минуты: она
      # потребовала бы установки зависимостей, то есть выполнения чужих postinstall
      # в прогоне с правом записи результатов сканирования.
      - name: Подготовить базу CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Прогнать запросы и отправить результаты
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
