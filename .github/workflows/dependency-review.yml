name: dependencyReview

# СХЕМА ПРОГОНА
#
#   pull request в develop / main ─► сравнить список зависимостей с целевой веткой:
#
#       новая зависимость с уязвимостью high и выше ─► красный
#       всё остальное ─────────────────────────────► таблица в сводке запуска
#
# Зачем отдельный прогон, а не job в ci.yml. Экшен работает только на событии
# pull_request: ему нужно сравнить две точки истории, до и после. А CI у нас намеренно
# не гоняется на PR в develop — проверки идут на интеграционных ветках. Этот прогон
# лёгкий (полминуты, без базы, без установки зависимостей), поэтому его не жалко
# включить и на PR в develop: новую уязвимую зависимость видно в том же PR, где её
# добавили, а не через неделю в аудите.
#
# Чем отличается от шага «Безопасность» в ci.yml. Тот смотрит на весь список целиком и
# отвечает на вопрос «что у нас сейчас есть». Этот отвечает на вопрос «что приносит
# именно это изменение» — и поэтому может быть блокирующим, не упираясь в старые
# находки, до которых руки ещё не дошли.
#
# Лицензии здесь не проверяются: выбор допустимого списка — отдельное решение, а не
# побочный эффект настройки CI. Экшен это умеет (allow-licenses / deny-licenses).

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Новые зависимости — уязвимости
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Забрать код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Порог high, а не moderate: срабатывание на каждую транзитивную находку среднего
      # уровня превращает проверку в шум, который начинают прокликивать. Общий список со
      # средними уровнями никуда не делся — он в сводке прогона CI.
      #
      # Комментарий в PR экшен писать умеет, но ради этого ему нужно право записи в
      # pull requests. Не выдаём: сводки запуска и красной галочки достаточно.
      - name: Сравнить зависимости с целевой веткой
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Блокирует только рантайм — ровно как `pnpm audit --prod` в ci.yml. Уязвимость
          # в сборочном инструменте важна, но останавливать ею мёрж нельзя: сейчас,
          # например, две high висят в undici, который приезжает транзитивно через shadcn,
          # то есть через CLI, не попадающий ни в один образ.
          fail-on-scopes: runtime
          comment-summary-in-pr: never
