name: iOS nightly

# Расширенный прогон: все UI-сценарии (включая живой сервер, если в секретах есть
# учётка) и замеры производительности против Tests/perf-baseline.json. На PR не идёт:
# замеры шумные и долгие, а регрессию между соседними прогонами видно по сводке и
# артефакту metrics.json.
#
# Когда запускается:
# - после каждого вливания правок iOS в develop (`push`) — работает уже сейчас;
# - ночью по расписанию и вручную. GitHub берёт расписание и ручной запуск только из
#   файла в ветке по умолчанию (`main`), поэтому эти два триггера оживут, когда develop
#   в очередной раз уйдёт в main. Код проверяется всегда из develop.
on:
  push:
    branches: [develop]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-nightly.yml'
  schedule:
    # 02:30 по Алматы (UTC+5).
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-nightly
  cancel-in-progress: true

jobs:
  full:
    name: UI и производительность
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SH_TEST_DEVICE: iPhone 17 Pro
      SH_TEST_OS: '26.5'
    defaults:
      run:
        working-directory: apps/ios
    steps:
      # После вливания — ровно тот коммит, что влили; по расписанию — свежий develop.
      - name: Забрать код
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}
          persist-credentials: false

      # Точная версия с проверкой суммы — см. .github/actions/setup-xcodegen.
      - name: Поставить XcodeGen
        uses: ./.github/actions/setup-xcodegen

      # Ключ — блок `packages` из project.yml и Package.resolved: подъём версии или номера
      # сборки пакеты не меняет и кеш сбрасывать не должен.
      - name: Ключ кеша пакетов
        id: spm-key
        run: echo "hash=$({ sed -n '/^packages:/,/^[a-z]/p' project.yml; cat Package.resolved; } | shasum -a 256 | cut -c1-16)" >>"$GITHUB_OUTPUT"

      - name: Кеш пакетов Swift
        uses: actions/cache@v6
        with:
          path: apps/ios/build/DerivedData/SourcePackages
          key: ios-spm-${{ steps.spm-key.outputs.hash }}
          restore-keys: ios-spm-

      # Учётка тестового вуза (не прод) — для ChatFlowsUITests на живом сервере. Нет
      # секретов — эти сценарии пропускаются, остальное идёт на mock API.
      - name: Полный прогон
        env:
          TEST_RUNNER_SH_UITEST_LOGIN: ${{ secrets.IOS_UITEST_LOGIN }}
          TEST_RUNNER_SH_UITEST_PASSWORD: ${{ secrets.IOS_UITEST_PASSWORD }}
        run: scripts/test.sh full

      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-nightly-results
          path: apps/ios/build/test-output
          retention-days: 30

