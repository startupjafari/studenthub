name: iOS preview

# Сборка приложения для СИМУЛЯТОРА и выкладывание её артефактом.
#
# Зачем, если есть ios.yml: тот проверяет, что код собирается и тесты зелёные, но
# посмотреть на приложение не даёт. Эта сборка не подписывается (симулятору подпись
# не нужна, учётная запись Apple тоже), и её можно загрузить в браузерный эмулятор
# вроде Appetize и потыкать руками с Windows — без Mac и без Developer Program.
#
# Только вручную. Репозиторий публичный, то есть раннеры GitHub для него бесплатны,
# но macOS-очередь длиннее обычной и сборка идёт минут шесть — держать её на каждом
# коммите незачем: проверку кода делает ios.yml.
on:
  # ВРЕМЕННО, снять перед PR. workflow_dispatch виден в Actions только когда файл
  # лежит в ветке по умолчанию (main), а туда прогон попадёт ещё не скоро. Без
  # этого триггера первый прогон не запустить вовсе и проверить обход нечем.
  push:
    branches: [fix/ios-testflight-readiness]

  workflow_dispatch:
    inputs:
      api:
        description: >-
          Адрес API для этой сборки, например https://xxx.up.railway.app/api/v1.
          Пусто — возьмётся localhost из Debug.xcconfig, и войти в приложение не
          получится: у браузерного эмулятора своего localhost нет.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ios

jobs:
  simulator-build:
    name: Сборка для симулятора
    runs-on: macos-15
    steps:
      - name: Забрать код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Поставить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        run: xcodegen generate

      # Адрес API задаётся с командной строки и перекрывает значение из xcconfig:
      # так одну и ту же ветку можно собрать хоть на прод, хоть на стенд, ничего
      # не коммитя.
      #
      # Архитектуры обе: браузерные эмуляторы бывают и на Apple Silicon, и на Intel,
      # а универсальная сборка для симулятора запустится в любом.
      - name: Собрать .app
        env:
          API: ${{ inputs.api }}
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme StudentHub \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            ${API:+API_BASE_URL="$API"}

      - name: Упаковать
        run: |
          cd build/dd/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/StudentHub-simulator.zip" StudentHub.app

      - name: Выложить артефактом
        uses: actions/upload-artifact@v7
        with:
          name: studenthub-simulator
          path: StudentHub-simulator.zip
          retention-days: 7

  screen-tour:
    name: Обход экранов с видео
    runs-on: macos-15
    steps:
      - name: Забрать код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Поставить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект
        run: xcodegen generate

      # Симулятор поднимаем заранее и сами: запись нужно начать до того, как
      # xcodebuild запустит приложение, иначе первые экраны в видео не попадут.
      - name: Обход с записью экрана
        run: |
          set -o pipefail
          DEVICE="iPhone 16"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

          xcrun simctl io booted recordVideo --codec h264 --force \
            "$GITHUB_WORKSPACE/screen-tour.mp4" &
          RECORDER=$!

          set +e
          xcodebuild test \
            -scheme StudentHubUITour \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath "$GITHUB_WORKSPACE/ScreenTour.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          STATUS=$?
          set -e

          # Именно SIGINT: по нему запись дописывает и закрывает файл. Обычное
          # убийство процесса оставляет битый mp4, то есть ровно то, ради чего
          # job и затевался.
          kill -INT "$RECORDER" 2>/dev/null || true
          wait "$RECORDER" 2>/dev/null || true
          exit "$STATUS"

      - name: Упаковать отчёт прогона
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d ScreenTour.xcresult ]; then
            zip -qry ScreenTour.xcresult.zip ScreenTour.xcresult
          fi

      # Выкладываем и при падении: видео упавшего обхода объясняет причину лучше
      # любого лога.
      - name: Выложить видео и отчёт
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studenthub-screen-tour
          path: |
            screen-tour.mp4
            ScreenTour.xcresult.zip
          if-no-files-found: warn
          retention-days: 7
