name: codeLighthouse

# СХЕМА ПРОГОНА
#
#   push в develop / main, руками ─► стенд как у web-e2e (своя база с фикстурой, api, веб)
#                                     + лендинг ─► Lighthouse, мобильная эмуляция:
#
#       публичные ......... лендинг /, /login, /legal/privacy, /legal/terms
#       за входом (студент)  /, /schedule, /chats — каждый прогон со свежим входом
#
#   ─► пороги из apps/web/lighthouserc.cjs: производительность и доступность ≥ 90
#      (медиана из трёх прогонов страницы) ─► сводка в Summary, отчёты — артефактом.
#
# Зачем: критерий релиза v1.0 «Lighthouse: производительность и доступность ≥ 90 на
# мобильном» (docs/IMPLEMENTATION_PLAN.md, Фаза 13) до сих пор проверялся руками — то есть
# не проверялся.
#
# Почему отдельный прогон, а не шаг в web-e2e. Lighthouse — это ещё ~20 прогонов по
# полминуты, и вешать их на каждый прогон сквозных сценариев значило бы удлинить самый
# долгий job codeChecks. Здесь своя сборка стенда (минуты три), но идёт она параллельно и
# только на push в интеграционные ветки и руками — не на PR и не ночью. Кеш компилятора
# Next берётся у web-e2e только на чтение (actions/cache/restore): стенд собирается с теми же
# NEXT_PUBLIC_*, и кеш подходит, а писать второй экземпляр того же ключа незачем.
#
# Почему не treosh/lighthouse-ci-action: экшен — та же @lhci/cli внутри, плюс ещё один
# сторонний `uses:` с доступом к рабочему каталогу. Версия CLI здесь закреплена точно
# (LHCI_VERSION), а npx ставит её мимо package.json — в зависимости проекта она не попадает.
#
# Страницы за входом. Access-токен живёт в памяти, сессию страница восстанавливает обменом
# refresh-cookie, а refresh одноразовый и ротируется (docs/PROJECT.md §7.2). Отдать
# Lighthouse одну cookie на три прогона нельзя: второй прогон предъявит погашенный токен, и
# реюз-детектор убьёт сессию. Поэтому каждый прогон — свой вход и своя cookie (`collect
# --additive` копит результаты), а медиану по ним считает `assert`.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse · мобильный, производительность и доступность ≥ 90
    runs-on: ubuntu-24.04
    # Сборка api, веба и лендинга — минут пять; Lighthouse — 21 прогон по ~30 с.
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studenthub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Две разные базы — по той же причине, что в web-e2e (ci.yml): prepare-db.mjs
      # сбрасывает DATABASE_URL_TEST и отказывается, если она совпадает с DATABASE_URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studenthub_ci
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/studenthub_e2e
      # Нечувствительные CI-значения (не секреты): нужны валидации окружения api.
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-32ch
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-32
      TOTP_ENCRYPTION_KEY: ci-totp-encryption-key-ci-totp-key-32
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ci-access
      MINIO_SECRET_KEY: ci-secret
      # Точная версия, не диапазон: смена версии Lighthouse двигает баллы сама по себе, и
      # такое изменение должно приходить отдельной правкой, а не молча со следующим прогоном.
      LHCI_VERSION: 0.15.1
      # Аккаунт фикстуры e2e (prisma/e2e-fixture.mjs) — тестовые данные, не секрет.
      LH_LOGIN: student@studenthub.app
      LH_PASSWORD: Admin1234!

    steps:
      - name: Забрать код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Поставить pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Поставить Node 24 и кеш pnpm-store
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Установить зависимости (frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Создать отдельную базу studenthub_e2e
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16-alpine \
            psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE studenthub_e2e'

      # Без хранилища api не стартует (MinioBucketsService заводит бакеты на старте).
      # Образ и его происхождение — см. комментарий в job `ci` (ci.yml).
      - name: Поднять MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-access \
            -e MINIO_ROOT_PASSWORD=ci-secret \
            bitnamilegacy/minio:2025.7.23-debian-12-r5
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "MinIO did not become healthy in time" >&2
          docker logs minio >&2 || true
          exit 1

      - name: Сгенерировать Prisma Client
        run: pnpm db:generate

      - name: Собрать общие пакеты (packages/*)
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Схема и фикстура стенда
        run: node apps/web/e2e/prepare-db.mjs

      # Только чтение: кеш пишет web-e2e (ci.yml), здесь он просто подхватывается.
      - name: Кеш сборки Next (от web-e2e)
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next-e2e/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Тот же outDir и те же переменные, что у webServer в playwright.config.ts: стенд один,
      # и баллы снимаются с той же прод-сборки, которую проходят сценарии.
      - name: Собрать api стенда
        working-directory: apps/api
        run: npx nest build -p tsconfig.e2e.json

      - name: Собрать веб стенда
        working-directory: apps/web
        env:
          NEXT_DIST_DIR: .next-e2e
          NEXT_PUBLIC_API_URL: http://localhost:3101/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:3101
          E2E: '1'
        run: npx next build

      - name: Собрать лендинг
        run: pnpm --filter landing build

      - name: Поднять api, веб и лендинг
        run: |
          mkdir -p /tmp/stand
          (
            cd apps/api
            PORT=3101 DATABASE_URL="$DATABASE_URL_TEST" NODE_ENV=development \
              CORS_ORIGIN=http://localhost:3100 TWO_FACTOR_ENFORCE=false THROTTLE_DISABLED=true \
              nohup node dist-e2e/main.js > /tmp/stand/api.log 2>&1 &
          )
          (cd apps/web && NEXT_DIST_DIR=.next-e2e nohup npx next start -p 3100 > /tmp/stand/web.log 2>&1 &)
          (cd apps/landing && nohup npx next start -p 3002 > /tmp/stand/landing.log 2>&1 &)
          for url in http://localhost:3101/api/v1/health http://localhost:3100/login http://localhost:3002/; do
            ok=
            for _ in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::стенд не ответил: $url"
              tail -n 50 /tmp/stand/*.log >&2
              exit 1
            fi
          done

      - name: Lighthouse — публичные страницы
        run: |
          npx --yes "@lhci/cli@${LHCI_VERSION}" collect \
            --config=apps/web/lighthouserc.cjs \
            --url=http://localhost:3002/ \
            --url=http://localhost:3100/login \
            --url=http://localhost:3100/legal/privacy \
            --url=http://localhost:3100/legal/terms

      # Каждый прогон — свой вход (см. шапку). Cookie уходит Lighthouse заголовком на все
      # запросы страницы: sh_role нужна middleware веба, sh_refresh — обмену на access-токен.
      - name: Lighthouse — страницы за входом
        run: |
          for page in / /schedule /chats; do
            for _ in 1 2 3; do
              jar=$(mktemp)
              body=$(jq -nc --arg id "$LH_LOGIN" --arg pw "$LH_PASSWORD" '{identifier: $id, password: $pw}')
              curl -fsS -c "$jar" -o /dev/null -X POST http://localhost:3101/api/v1/auth/login \
                -H 'Content-Type: application/json' -d "$body"
              cookie=$(awk '$6 == "sh_refresh" || $6 == "sh_role" { printf "%s%s=%s", sep, $6, $7; sep = "; " }' "$jar")
              rm -f "$jar"
              headers=$(jq -nc --arg c "$cookie" '{Cookie: $c}')
              npx --yes "@lhci/cli@${LHCI_VERSION}" collect \
                --config=apps/web/lighthouserc.cjs \
                --additive \
                --numberOfRuns=1 \
                --url="http://localhost:3100${page}" \
                --settings.extraHeaders="$headers"
            done
          done

      - name: Сводка в Summary
        if: always()
        run: node apps/web/e2e/support/lighthouse-summary.mjs .lighthouseci >> "$GITHUB_STEP_SUMMARY"

      - name: Пороги — производительность и доступность ≥ 90
        run: npx --yes "@lhci/cli@${LHCI_VERSION}" assert --config=apps/web/lighthouserc.cjs

      # Отчёты нужны и на зелёном прогоне: баллы у самой границы видны только в них.
      - name: Отчёты Lighthouse в каталог
        if: always()
        run: npx --yes "@lhci/cli@${LHCI_VERSION}" upload --config=apps/web/lighthouserc.cjs || true

      - name: Отчёты Lighthouse — артефактом
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: |
            lhci-report
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 14

      - name: Логи стенда — при падении
        if: failure()
        run: tail -n 100 /tmp/stand/*.log || true
