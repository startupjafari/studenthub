name: Release · описание опубликованного релиза

# СХЕМА ПРОГОНА
#
#   человек опубликовал релиз (тег vX.Y.Z) ─► нота «Что нового» для версии написана?
#       ├─ нет ........... прогон красный, описание не трогаем
#       └─ да ─► тело релиза пустое? ─► да: собрать описание (нота + коммиты) и записать
#                                       нет: оставить как есть — текст написан руками
#
# Срабатывает, когда человек опубликовал релиз в интерфейсе GitHub (Releases → Draft a new
# release → тег vX.Y.Z на main). Всё остальное собирается здесь:
#
#   1. сверяем, что для этой версии написана нота «Что нового» (иначе пользователи не
#      узнают, что изменилось, — а узнать потом уже неоткуда: нота едет в бандле);
#   2. если тело релиза пустое, заполняем его — человеческий текст ноты плюс
#      conventional-коммиты с прошлого тега, сгруппированные по типам.
#
# Написанное руками описание не трогаем: пустое тело — это «собери сам», непустое — «я уже
# написал». Кнопка GitHub «Generate release notes» тоже считается написанным вручную.
#
# Деплой сюда не входит: Railway выкатывает по push в main, то есть раньше этого workflow.
# Тег — человеческое имя для того, что уже уехало.

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  notes:
    name: Описание релиза — проверить и заполнить
    runs-on: ubuntu-24.04
    # Прогон читает git и вызывает gh — укладывается в полминуты. Лимит здесь против
    # зависшего сетевого вызова, а не против медленных шагов.
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 — нужны и теги, и история: описание строится по диапазону
      # «предыдущий тег → этот».
      - name: Забрать код по тегу релиза, с историей
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      # package-manager-cache: false — прогон запускается по событию release и ничего не
      # устанавливает (скрипт ноты ходит только в git и в gh). Включённый по умолчанию кеш
      # пакетного менеджера здесь не экономит ничего, зато заводит ещё один путь, по
      # которому в прогон релиза попадает содержимое, собранное в другом прогоне.
      - name: Поставить Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      # Имя тега приходит из события и в shell попадает только через переменную окружения:
      # подставленное прямо в команду, оно выполнилось бы как часть этой команды — тег
      # создаёт человек, и имя у него произвольное.
      - name: Проверить, что для версии написана нота «Что нового»
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release.mjs verify "$TAG"

      - name: Заполнить описание релиза — только если тело пустое
        if: ${{ !github.event.release.body }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/release.mjs body "$TAG" > release-body.md
          gh release edit "$TAG" --notes-file release-body.md
