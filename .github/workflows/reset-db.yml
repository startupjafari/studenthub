name: prodDbReset
# Заголовок запуска: в списке прогонов ручные операции выглядели одинаково, и что
# именно делали — читалось только внутри. Теперь видно режим и кто запустил.
run-name: ОЧИСТКА прод-БД · останется ${{ inputs.admin_email }} · запустил ${{ github.actor }}

# СХЕМА ПРОГОНА
#
#   подтверждение RESET ─► сверка миграций ─► TRUNCATE всех таблиц
#                          ─► остаётся один PLATFORM_ADMIN ─► КАТО (по галочке) ─► итог
#
#   Миграции этот прогон не применяет, только сверяет: ветка выбирается в форме, и
#   накатить на прод её схему без показа SQL нельзя. Применяет их «Прод-БД · миграции»
#   (migrate.yml) — в том числе на пустую базу перед первым сбросом.
#
#   Обратного хода нет. Слепок базы перед прогоном — Railway → Postgres → Backups.
#
# РУЧНОЙ полный сброс прод-БД: все таблицы пустые, остаётся один PLATFORM_ADMIN.
#
# Зачем: перед реальным запуском нужно убрать демо-данные сида (тысячи пользователей
# с паролем Admin1234!), не трогая схему. Скрипт делает TRUNCATE, а не `migrate reset`,
# поэтому журнал миграций цел и повторный db:deploy не требуется.
#
# ЭТО НЕОБРАТИМО. Запускается только вручную и только если в поле подтверждения
# набрано RESET. Слепок БД Railway перед прогоном — на совести запускающего:
# Railway → Postgres → Backups.
#
# Требуется секрет репозитория DATABASE_PUBLIC_URL (как у workflow «SEED»).
# Пароль администратора — только секретом RESET_ADMIN_PASSWORD: сгенерированный пароль
# пришлось бы напечатать в лог прогона, а лог публичный. Без секрета прогон отказывается.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Наберите RESET — иначе прогон откажется работать'
        type: string
        required: true
      admin_email:
        description: 'E-mail администратора платформы'
        type: string
        default: admin@studenthub.app
      run_seed_kato:
        description: 'Залить справочник КАТО после сброса (без него пустой селект «Город»)'
        type: boolean
        default: true

# Сброс и seed не должны идти одновременно по одной БД.
# Прогон ходит в прод-БД, а с кодом только читает: токену хватает contents: read.
permissions:
  contents: read

concurrency:
  group: db-write-railway
  cancel-in-progress: false

jobs:
  reset:
    name: Сброс — в базе остаётся один администратор
    runs-on: ubuntu-24.04
    # С запасом на заливку справочника КАТО по галочке. Причина лимита та же, что у
    # миграций: зависший job держит соединение с прод-БД часами.
    timeout-minutes: 30
    # Окружение production: секрет прод-БД можно закрыть ревьюером/правилами.
    environment: production

    env:
      DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}

    steps:
      # Подтверждение проверяем ДО checkout: неверный ввод не должен ничего запускать.
      - name: Проверить подтверждение RESET и секреты
        env:
          CONFIRM: ${{ inputs.confirm }}
          # Сам секрет в шаг не попадает: нужен только факт «задан или нет».
          ADMIN_PASSWORD_SET: ${{ secrets.RESET_ADMIN_PASSWORD != '' }}
        run: |
          if [ "$CONFIRM" != "RESET" ]; then
            echo "::error::Подтверждение не совпало: ожидалось RESET." >&2
            exit 1
          fi
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Секрет DATABASE_PUBLIC_URL не задан в настройках репозитория." >&2
            exit 1
          fi
          if [ "$ADMIN_PASSWORD_SET" != "true" ]; then
            echo "::error::Секрет RESET_ADMIN_PASSWORD не задан: сгенерированный пароль ушёл бы в публичный лог." >&2
            exit 1
          fi

      # План прогона — в сводку запуска: что именно сейчас произойдёт с боевой базой,
      # видно до того, как это произошло, и остаётся в истории запусков.
      - name: Схема прогона — в сводку запуска
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Сброс прод-БД

          ```mermaid
          flowchart LR
            A["подтверждение RESET"] --> B["сверка миграций"]
            B --> C["TRUNCATE всех таблиц"]
            C --> D["остаётся один<br/>PLATFORM_ADMIN"]
            D --> E["справочник КАТО<br/>по галочке"]
          ```

          Схема таблиц не меняется — журнал миграций цел, повторный `db:deploy` не нужен.
          Обратного хода нет: данные восстанавливаются только из слепка Railway.
          MD

      - name: Забрать код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Поставить pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Поставить Node 24 и кеш pnpm-store
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Установить зависимости (frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: Сгенерировать Prisma Client
        run: pnpm db:generate

      # Только сверка: сброс оставляет таблицы как есть, и схема должна совпадать с той,
      # под которую написаны скрипт сброса и КАТО. Применять миграции отсюда нельзя.
      - name: Сверить миграции базы с веткой
        run: |
          set +e
          out=$(pnpm db:status 2>&1)
          set -e
          echo "$out"
          # На код возврата не полагаемся (как в ci.yml): строка про актуальность схемы
          # стабильнее кода выхода между версиями Prisma.
          if ! echo "$out" | grep -q "Database schema is up to date"; then
            echo "::error::Схема базы расходится с prisma/migrations этой ветки. Миграции применяются только прогоном «Прод-БД · миграции» — сначала status и SQL, затем deploy." >&2
            exit 1
          fi

      - name: Очистить таблицы, оставив одного администратора
        env:
          RESET_CONFIRM: RESET
          # БД Railway не localhost — гард скрипта снимается осознанно здесь.
          RESET_ALLOW_REMOTE: '1'
          RESET_ADMIN_EMAIL: ${{ inputs.admin_email }}
          RESET_ADMIN_PASSWORD: ${{ secrets.RESET_ADMIN_PASSWORD }}
        run: pnpm db:reset:admin

      # КАТО — не демо-данные, а часть развёртывания: `University.city` хранит 9-значный
      # код, и без справочника его не во что резолвить. Сидер идемпотентен.
      - name: Залить справочник КАТО — по галочке
        if: ${{ inputs.run_seed_kato }}
        run: pnpm db:seed:kato

      # admin_email — ввод запускающего, в shell идёт переменной окружения, а не подстановкой.
      - name: Итог — в сводку запуска
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          {
            echo "### Сброс БД выполнен"
            echo ""
            echo "В базе остался один пользователь — PLATFORM_ADMIN \`$ADMIN_EMAIL\`."
            echo "Пароль — из секрета \`RESET_ADMIN_PASSWORD\`."
          } >> "$GITHUB_STEP_SUMMARY"
