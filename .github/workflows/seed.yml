name: prodDbSeed
# Заголовок запуска: в списке прогонов видно режим, метку и кто запустил.
run-name: Налить данные · ${{ inputs.mode }} · метка ${{ inputs.tag || 'авто' }} · запустил ${{ github.actor }}

# СХЕМА ПРОГОНА
#
#   режим seed    ─► проверка формы → сверка миграций → база пустая? → замер →
#                    генератор наливает ВСЕ разделы платформы, без фото и видео →
#                    итог цифрами по разделам
#   режим cleanup ─► проверка формы → сверка миграций → удаляются вузы ТОЛЬКО с
#                    указанной меткой → итог цифрами
#
# ЧТО НАЛИВАЕТСЯ. Каждый вуз генератора (prisma/seed/index.mjs) получает всё, что есть в
# продукте: структуру и людей всех ролей (включая охрану и библиотекаря), академику
# (расписание, журнал, посещаемость, экзамены, задания, консультации), библиотеку, ленту,
# события, статьи, опросы, истории, чаты, документы и заявки, карьеру, журналы охраны,
# камеры и опубликованный кампус. Плюс справочники платформы: КАТО, каталог услуг,
# компании-работодатели.
#
# БЕЗ ФОТО И ВИДЕО — жёстко, не полем формы. Медиа-пул, личные галереи и картинки постов
# выключены, переменные MinIO в прогон не передаются вовсе: генератор не создаёт ни
# одной строки File и ни одного объекта в хранилище. Стикеры (картинки) поэтому тоже
# пропускаются — их отдельно заливает `pnpm db:seed:stickers`.
#
# КАК ПОЛЬЗОВАТЬСЯ. Порядок — сброс, потом налив:
#   1. prodDbReset (reset-db.yml) — база пустеет до одного PLATFORM_ADMIN;
#   2. этот прогон, режим seed. Галочка «только в пустую базу» (по умолчанию включена)
#      не даст налить второй слой поверх уже налитого.
# Без галочки прогон доливает: id детерминированы, уже созданные вузы пропускаются по
# маркеру, новые (universities больше прежнего) добавляются рядом.
#
# Метка пишется в манифест (AuditLog) и маркеры вузов; режим cleanup по ней удаляет
# ровно налитое этим прогоном. Потолки объёма проверяет сам сид до первой записи:
# выше 50 млн строк нужен `confirm: BIG`, выше 300 млн прогон отказывается работать.
#
# Секреты окружения production: DATABASE_PUBLIC_URL (строка подключения к Postgres
# Railway) и SEED_PASSWORD (пароль всех аккаунтов налива: сгенерированный пришлось бы
# печатать в публичный лог прогона). Миграции этот прогон не применяет — только сверяет;
# применяет их prodDbMigrate (migrate.yml).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: seed (налить) / cleanup (удалить налитое по метке)'
        type: choice
        default: seed
        options:
          - seed
          - cleanup
      tag:
        description: 'Метка прогона. Пусто = seed-<номер запуска>. Для cleanup — обязательна'
        type: string
        default: ''
      confirm:
        description: 'Для cleanup — повторите метку. Для объёма выше 50 млн строк — BIG'
        type: string
        default: ''
      only_empty:
        description: 'Только в пустую базу (после prodDbReset). Снять — долить к уже налитому'
        type: boolean
        default: true
      universities:
        description: 'Сколько вузов, 1–500'
        type: string
        default: '1'
      students:
        description: 'Студентов на вуз: «1000-1500» или число. Меньше 400 не бывает: 4 факультета × 4 курса × 25'
        type: string
        default: '1000-1500'
      posts:
        description: 'Постов на пользователя: «A-B» или число («0» — без постов)'
        type: string
        default: '5-20'
      articles:
        description: 'Статей на пользователя: «A-B» или число'
        type: string
        default: '1-5'
      polls:
        description: 'Опросов на пользователя: «A-B» или число'
        type: string
        default: '1-5'

# Прогон пишет в БД Railway, а с кодом только читает: токену хватает contents: read.
permissions:
  contents: read

# Одна группа со сбросом: налив, уборка и TRUNCATE не должны идти одновременно по одной БД.
concurrency:
  group: db-write-railway
  cancel-in-progress: false

jobs:
  seed:
    name: ${{ inputs.mode }} · ${{ inputs.universities }} вуз(ов)
    runs-on: ubuntu-24.04
    # Отдельное окружение — чтобы секрет БД можно было ограничить ревью и правилами.
    environment: production
    # Потолок job'а у GitHub — 6 часов. 500 вузов идут около пяти часов, и обрыв по
    # таймауту посреди прогона оставит половину вуза без расписания и оценок.
    timeout-minutes: 350

    env:
      DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}

    steps:
      # Всё, что можно проверить до checkout, проверяется до него: опечатка в форме не
      # должна стоить пяти минут установки зависимостей. Значения формы приходят через
      # env, а не подстановкой в текст скрипта: иначе `; rm -rf /` исполнился бы шеллом.
      - name: Проверить форму и секреты
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
          # Сам секрет в шаг не попадает: нужен только факт «задан или нет».
          SEED_PASSWORD_SET: ${{ secrets.SEED_PASSWORD != '' }}
          UNIS: ${{ inputs.universities }}
          STUDENTS: ${{ inputs.students }}
          POSTS: ${{ inputs.posts }}
          ARTICLES: ${{ inputs.articles }}
          POLLS: ${{ inputs.polls }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Секрет DATABASE_PUBLIC_URL не задан в окружении production." >&2
            exit 1
          fi

          # Метка по умолчанию привязана к номеру запуска: два прогона не сольются в один
          # манифест, и по метке видно, какой запуск её оставил.
          RUN_TAG="${TAG:-seed-${GITHUB_RUN_NUMBER}}"
          [[ "$RUN_TAG" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || {
            echo "::error::tag: допустимы буквы, цифры, точка, дефис и подчёркивание (до 64 знаков)." >&2; exit 1; }

          if [ "$MODE" = "cleanup" ]; then
            if [ "$CONFIRM" != "$RUN_TAG" ]; then
              echo "::error::cleanup удаляет данные. Повторите метку «$RUN_TAG» в поле confirm." >&2
              exit 1
            fi
            {
              echo "SEED_MODE=cleanup"
              echo "SEED_TAG=$RUN_TAG"
            } >> "$GITHUB_ENV"
            echo "Режим: уборка прогона «$RUN_TAG»"
            exit 0
          fi

          if [ "$SEED_PASSWORD_SET" != "true" ]; then
            echo "::error::Секрет SEED_PASSWORD не задан: сгенерированный пароль ушёл бы в публичный лог." >&2
            exit 1
          fi

          [[ "$UNIS" =~ ^[0-9]+$ ]] || { echo "::error::universities: ожидалось число, получено «$UNIS»." >&2; exit 1; }
          [ "$UNIS" -ge 1 ] && [ "$UNIS" -le 500 ] || {
            echo "::error::universities: от 1 до 500." >&2; exit 1; }

          # Диапазоны разбирает сам сид (prisma/seed/config.mjs), здесь — только мусор.
          check_range() {
            local name="$1" value="$2"
            [[ "$value" =~ ^[0-9]+(-[0-9]+)?$ ]] || {
              echo "::error::$name: ожидалось «A-B» или число, получено «$value»." >&2; exit 1; }
          }
          check_range students "$STUDENTS"
          check_range posts "$POSTS"
          check_range articles "$ARTICLES"
          check_range polls "$POLLS"

          {
            echo "SEED_MODE=seed"
            echo "SEED_TAG=$RUN_TAG"
            echo "SEED_UNIVERSITIES=$UNIS"
            echo "SEED_STUDENTS=$STUDENTS"
            echo "SEED_POSTS=$POSTS"
            echo "SEED_ARTICLES=$ARTICLES"
            echo "SEED_POLLS=$POLLS"
          } >> "$GITHUB_ENV"

          # Осознанное согласие на большой объём. Потолок считает сид; жёсткий не снимается.
          if [ "$CONFIRM" = "BIG" ]; then echo "SEED_CONFIRM_BIG=1" >> "$GITHUB_ENV"; fi

          echo "Метка: $RUN_TAG · вузов: $UNIS · студентов на вуз: $STUDENTS"
          echo "На пользователя — посты $POSTS, статьи $ARTICLES, опросы $POLLS. Фото и видео: нет."

      - name: Схема прогона — в сводку запуска
        env:
          MODE: ${{ inputs.mode }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<MD
          ## Налив данных · режим \`${MODE}\` · метка \`${SEED_TAG}\`

          \`\`\`mermaid
          flowchart LR
            A["форма"] --> B["сверка миграций"]
            B --> C{"режим"}
            C -- seed --> D["база пустая?"]
            D --> E["все разделы<br/>без фото и видео"]
            C -- cleanup --> F["удалить вузы<br/>с этой меткой"]
            E --> G["итог цифрами"]
            F --> G
          \`\`\`
          MD

      - name: Забрать код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Поставить pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Поставить Node 24 и кеш pnpm-store
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Установить зависимости (frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # Шаг кампуса (prisma/seed/steps/85-campus.mjs) берёт раскладку, проверку этажа и
      # граф маршрутов из dist campus-core — тех же функций, что у редактора и публикации.
      - name: Собрать campus-core
        run: pnpm --filter @studenthub/campus-core build

      - name: Сгенерировать Prisma Client
        run: pnpm db:generate

      # Только сверка: забытые миграции ломают сид на первом же запросе, а применять их
      # отсюда нельзя — ветка выбрана в форме, SQL никто не видел.
      - name: Сверить миграции базы с веткой
        run: |
          set +e
          out=$(pnpm db:status 2>&1)
          set -e
          echo "$out"
          # Строка про актуальность схемы стабильнее кода выхода между версиями Prisma.
          if ! echo "$out" | grep -q "Database schema is up to date"; then
            echo "::error::Схема базы расходится с prisma/migrations этой ветки. Сначала prodDbMigrate: status, SQL глазами, deploy." >&2
            exit 1
          fi

      # Пустая база — это то, что оставляет prodDbReset: один PLATFORM_ADMIN и ни одного
      # вуза. Всё остальное значит, что налив пойдёт поверх уже существующих данных.
      - name: Убедиться, что база пустая
        if: ${{ inputs.mode == 'seed' && inputs.only_empty }}
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const p = new PrismaClient();
            (async () => {
              const [users, unis] = await Promise.all([p.user.count(), p.university.count()]);
              await p.\$disconnect();
              if (unis > 0 || users > 1) {
                console.error('::error::В базе уже ' + unis + ' вуз(ов) и ' + users + ' пользователей. ' +
                  'Сначала prodDbReset — или снимите галочку «только в пустую базу», чтобы долить.');
                process.exit(1);
              }
              console.log('База пустая: вузов 0, пользователей ' + users + '.');
            })().catch((e) => { console.error(e.message); process.exit(1); });
          "

      # Размер базы ДО прогона: рост должен быть виден числом, а не на глаз.
      - name: Замерить базу до прогона
        id: before
        shell: bash
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const p = new PrismaClient();
            (async () => {
              const rows = await p.\$queryRawUnsafe(\"SELECT sum(n_live_tup)::bigint AS rows FROM pg_stat_user_tables WHERE schemaname='public'\");
              const size = await p.\$queryRawUnsafe('SELECT pg_size_pretty(pg_database_size(current_database())) AS size');
              console.log('rows=' + (rows[0].rows ?? 0));
              console.log('size=' + size[0].size);
              await p.\$disconnect();
            })().catch((e) => { console.error(e.message); process.exit(0); });
          " >> "$GITHUB_OUTPUT"

      # Демо-вуз «Алатау» выключен: сотни аккаунтов под одним паролем и dev-инвайт с
      # известным токеном на общей базе — это готовый вход, а не демонстрация.
      # Медиа выключены всеми переключателями сразу, MINIO_* не передаются.
      - name: Налить данные — или убрать прогон по метке
        env:
          SEED_ALLOW_REMOTE: '1'
          SEED_DEMO_UNIVERSITY: '0'
          SEED_SCALE: full
          SEED_CONCURRENCY: '4'
          SEED_MEDIA: '0'
          SEED_PHOTOS_PER_USER: '0'
          SEED_VIDEOS_PER_USER: '0'
          SEED_POST_IMAGES_PER_USER: '0'
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: node --max-old-space-size=4096 prisma/seed.mjs

      # Что в итоге в базе — цифрами по разделам, из той же базы.
      - name: Итог цифрами — в сводку запуска
        if: ${{ always() }}
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ROWS_BEFORE: ${{ steps.before.outputs.rows }}
          SIZE_BEFORE: ${{ steps.before.outputs.size }}
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const p = new PrismaClient();
            const sections = [
              ['Вузы', 'university'], ['Факультеты', 'faculty'], ['Группы', 'group'],
              ['Пользователи', 'user'], ['Пары', 'pair'], ['Оценки', 'grade'],
              ['Посещаемость', 'attendance'], ['Книги · выдачи', 'book', 'loan'],
              ['Посты', 'post'], ['События', 'event'], ['Статьи', 'profileArticle'],
              ['Истории', 'story'], ['Чаты · сообщения', 'chat', 'message'],
              ['Документы · заявки', 'document', 'application'],
              ['Вакансии · отклики', 'vacancy', 'careerApplication'],
              ['Журнал охраны · проходы', 'securityVisitor', 'securityPass'],
              ['Камеры', 'camera'], ['Кампусы', 'campus'], ['Файлы', 'file'],
            ];
            (async () => {
              const nf = (n) => Number(n).toLocaleString('ru-RU');
              const count = async (m) => (p[m] ? await p[m].count().catch(() => '—') : '—');
              const lines = [
                '### ' + (process.env.MODE === 'cleanup' ? 'Уборка выполнена' : 'Прогон выполнен'),
                '', '| Раздел | Строк |', '|---|---|',
                '| Метка | \`' + (process.env.SEED_TAG || '—') + '\` |',
              ];
              for (const [label, ...models] of sections) {
                const values = [];
                for (const m of models) { const v = await count(m); values.push(typeof v === 'number' ? nf(v) : v); }
                lines.push('| ' + label + ' | ' + values.join(' · ') + ' |');
              }
              const rows = await p.\$queryRawUnsafe(\"SELECT sum(n_live_tup)::bigint AS rows FROM pg_stat_user_tables WHERE schemaname='public'\");
              const size = await p.\$queryRawUnsafe('SELECT pg_size_pretty(pg_database_size(current_database())) AS size');
              const before = Number(process.env.ROWS_BEFORE || 0);
              const after = Number(rows[0].rows ?? 0);
              const delta = after - before;
              lines.push('| Строк в БД | ' + nf(after) + ' (было ' + nf(before) + ', ' + (delta >= 0 ? '+' : '') + nf(delta) + ') |');
              lines.push('| Размер БД | ' + size[0].size + ' (было ' + (process.env.SIZE_BEFORE || '—') + ') |');
              lines.push('', 'Строки в pg_stat_user_tables — оценка Postgres, точные числа — по разделам выше.');
              lines.push('Дашборд платформы кэшируется в Redis на 5 минут — свежие цифры там появятся с задержкой.');
              require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
              await p.\$disconnect();
            })().catch((e) => { console.error(e.message); process.exit(0); });
          "
