name: prodDbSeed
# Одноразовая подмена на ветке chore/purge-chat-images: уборка картинок чатов на Railway
# (prisma/purge-chat-images.mjs). Ветку в develop/main не вливать.
run-name: Уборка картинок чатов · запустил ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Удаляет картинки чатов на Railway. Впишите PURGE'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: db-write-railway
  cancel-in-progress: false

jobs:
  purge:
    name: Уборка картинок чатов
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
    steps:
      - name: Проверить подтверждение
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "PURGE" ] || { echo "::error::Впишите PURGE в поле confirm." >&2; exit 1; }
          [ -n "$DATABASE_URL" ] || { echo "::error::Секрет DATABASE_PUBLIC_URL не задан." >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - name: Удалить картинки чатов
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_USE_SSL: ${{ secrets.MINIO_USE_SSL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: node prisma/purge-chat-images.mjs
