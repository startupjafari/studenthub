name: prodDbSeed
# Одноразовая подмена на ветке chore/railway-chat-testers: две учётки для проверки чатов
# (prisma/chat-test-accounts.mjs). Ветку в develop/main не вливать.
run-name: Учётки для чатов · запустил ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Меняет пароль двум студентам на Railway. Впишите PURGE'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: db-write-railway
  cancel-in-progress: false

jobs:
  testers:
    name: Учётки для чатов
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
    steps:
      - name: Проверить подтверждение
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "PURGE" ] || { echo "::error::Впишите PURGE в поле confirm." >&2; exit 1; }
          [ -n "$DATABASE_URL" ] || { echo "::error::Секрет DATABASE_PUBLIC_URL не задан." >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - name: Выдать пароль двум студентам
        run: node prisma/chat-test-accounts.mjs
