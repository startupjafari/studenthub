name: prodSmoke

# СХЕМА ПРОГОНА
#
#   проверки на main прошли (Railway начал выкатку) ─► ждём и опрашиваем:
#       API  → GET /api/v1/health   до 24 попыток по 15 с (шесть минут)
#       Веб  → GET /                до 24 попыток по 15 с (шесть минут)
#
#   Адреса не заданы — прогон не падает, а пишет, чего не хватает.
#
#   Прод ответил ─► черновик релиза, если версия из ноты ещё не выпущена.
#
# Проверка, что уехавшее на прод живое.
#
# Railway деплоит по push в main и о результате никому не сообщает: до сих пор «поднялось
# ли» проверял человек глазами, а в худшем случае — узнавал от студента. Этот прогон ждёт,
# пока платформа подхватит новый образ, и стучится в те же две точки, куда стучится
# пользователь: health-эндпоинт API и главную страницу веба.
#
# Почему не в ci.yml: тот прогон про код, этот — про среду. Красный smoke не означает, что
# код плохой, он означает, что прод не отвечает, и разбираться нужно в Railway.
#
# АДРЕСА берутся из переменных репозитория (Settings → Secrets and variables → Actions →
# Variables), а не из секретов: публичный домен не тайна, а в логе прогона его видеть
# полезно. Переменные не заданы — прогон не падает, а пишет, чего не хватает: лучше явный
# пропуск, чем красный main у того, кто про эту проверку ещё не знает.
#
#   SMOKE_API_URL — например https://api.example.kz  (корень домена, без пути)
#   SMOKE_WEB_URL — например https://app.example.kz
#
# Ручной запуск (workflow_dispatch) нужен для проверки после ручных операций: применения
# миграций, смены переменных, перезапуска сервиса.

# Запускается не по самому push в main, а по успешному завершению проверок на нём.
#
# Было: push в main → сразу опрос прода. Если прогон с проверками при этом красный,
# Railway всё равно начинал выкатку, а Smoke шесть минут опрашивал прод и честно
# сообщал, что тот не отвечает — хотя смотреть надо было в упавшие проверки.
#
# Стало: Smoke стартует только после зелёных проверок на main. Красные — Smoke не идёт
# вовсе, и красная галочка остаётся одна, та, что по делу.
#
# ВАЖНО: `workflows` ссылается на прогон по его ИМЕНИ, а не по файлу. Переименуете
# `codeChecks` в ci.yml — поправьте и здесь, иначе Smoke просто перестанет запускаться,
# молча.
on:
  workflow_run:
    workflows: [codeChecks]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Прогон не забирает код и ходит только по публичным адресам прода — токен ему не нужен
# вовсе. Пустой набор прав это и означает.
permissions: {}

concurrency:
  group: smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    name: Прод отвечает — API и веб
    # При ручном запуске проверять нечего: человек сам решил постучаться в прод.
    # При запуске по завершении проверок идём только на зелёных.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      API_URL: ${{ vars.SMOKE_API_URL }}
      WEB_URL: ${{ vars.SMOKE_WEB_URL }}

    steps:
      # Нет адресов — прогон ПАДАЕТ, а не пропускает проверку молча.
      #
      # Раньше здесь стояло предупреждение и `skip=true`: все шаги выключались, и job
      # завершался успехом. То есть после каждой выкатки на вопрос «прод поднялся?»
      # приходил зелёный ответ от прогона, который никуда не стучался. Это ровно то, о чём
      # сказано у аудита зависимостей в ci.yml: игнорируемая проверка хуже её отсутствия,
      # потому что создаёт видимость контроля. У смоука цена выше — он единственный, кто
      # отвечает за «выкатка доехала», и подменить его нечем.
      #
      # Красный прогон здесь читается однозначно: выкатка НЕ проверена. Чинится за минуту
      # — задать две переменные (docs/RUNBOOK.md, «Что настроить»).
      #
      # Задан хотя бы один адрес — идём дальше и проверяем его: шаги ниже сами смотрят на
      # свой `env`. Падаем только когда не задано ничего.
      - name: Проверить, что адреса прода заданы
        run: |
          if [ -z "${API_URL}" ] && [ -z "${WEB_URL}" ]; then
            {
              echo "## Выкатка не проверена"
              echo ""
              echo "Переменные \`SMOKE_API_URL\` и \`SMOKE_WEB_URL\` не заданы — стучаться некуда."
              echo "Задать: Settings → Secrets and variables → Actions → Variables"
              echo "(значения и порядок — в \`docs/RUNBOOK.md\`, раздел про prodUptime)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Адреса прода не заданы (SMOKE_API_URL, SMOKE_WEB_URL) — выкатка не проверена."
            exit 1
          fi

      # Что именно проверяется — в сводку запуска: открыв прогон, видно и схему, и адреса,
      # по которым стучались, без чтения шагов.
      - name: Схема прогона — в сводку запуска
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<MD
          ## Прод отвечает?

          \`\`\`mermaid
          flowchart LR
            A["push в main"] --> B["Railway собирает<br/>и перезапускает сервисы"]
            B --> C["API · GET /api/v1/health"]
            B --> D["Веб · GET /"]
          \`\`\`

          Каждую точку опрашиваем до шести минут (24 попытки по 15 с) — столько занимает
          выкатка. Красный прогон означает «прод не отвечает», а не «код плохой»:
          разбираться нужно в Railway.

          | Что | Адрес |
          |---|---|
          | API | ${API_URL:-—} |
          | Веб | ${WEB_URL:-—} |
          MD

      # Railway забирает образ не мгновенно: сборка и перезапуск занимают минуты. Ждём и
      # опрашиваем, а не проверяем один раз — иначе прогон ловил бы старую версию или
      # окно перезапуска и краснел бы на ровном месте.
      #
      # 24 попытки по 15 секунд — шесть минут. Дольше ждать нет смысла: если за это время
      # сервис не поднялся, дело не в медленном деплое.
      - name: Дождаться, пока API ответит на /health
        if: env.API_URL != ''
        run: |
          # Путь тот же, что у healthcheck Railway (apps/api/railway.json): health живёт
          # под глобальным префиксом API, отдельного /health в обход префикса нет.
          url="${API_URL%/}/api/v1/health"
          echo "Проверяю $url"
          for i in $(seq 1 24); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "API отвечает 200"
              cat /tmp/health.json
              exit 0
            fi
            echo "  попытка $i: $code"
            sleep 15
          done
          echo "::error::API не ответил 200 за шесть минут — последний код: $code"
          cat /tmp/health.json || true
          exit 1

      # Главную страницу проверяем отдельно: api и web на Railway — разные сервисы, и
      # выкатка одного не говорит ничего о втором. Веб отдаёт 200 и на экране входа —
      # этого достаточно, чтобы отличить «поднялся» от «502 от платформы».
      - name: Дождаться, пока веб отдаст страницу
        if: env.WEB_URL != ''
        run: |
          url="${WEB_URL%/}/"
          echo "Проверяю $url"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
            case "$code" in
              200 | 30[0-9])
                echo "Веб отвечает $code"
                exit 0
                ;;
            esac
            echo "  попытка $i: $code"
            sleep 15
          done
          echo "::error::Веб не ответил за шесть минут — последний код: $code"
          exit 1

  # Черновик релиза — после того, как прод ответил.
  #
  # Релиз до сих пор начинался с того, что человек вспомнил его создать. Нота «Что
  # нового» при этом уже лежит в репозитории (её наличие проверяет прогон на PR в main),
  # то есть всё для описания готово — не хватало только нажатия.
  #
  # Теперь черновик появляется сам: версию берём из последней ноты, тег — `v<версия>`.
  # Есть такой тег или релиз (хоть черновик) — ничего не делаем: прогон идёт после
  # каждой выкатки, и плодить дубли нельзя.
  #
  # Именно ЧЕРНОВИК, а не готовый релиз: тег создаётся в момент публикации, и решение
  # «выпускаем» остаётся за человеком. Прогон делает скучную часть — собирает описание.
  release-draft:
    name: Черновик релиза, если версия ещё не выпущена
    needs: smoke
    if: needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      # Единственное место в этом прогоне, где нужна запись: создание черновика.
      contents: write

    steps:
      # fetch-depth: 0 — описание строится по диапазону «предыдущий тег → HEAD», нужны
      # и теги, и история.
      - name: Забрать код с историей и тегами
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Поставить Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Создать черновик, если версии ещё нет
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          version=$(node scripts/release.mjs latest)
          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            {
              echo "## Черновик релиза"
              echo ""
              echo "Релиз \`$tag\` уже существует — ничего не делаем."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node scripts/release.mjs body "$tag" HEAD > release-body.md
          gh release create "$tag" \
            --draft \
            --target main \
            --title "$tag" \
            --notes-file release-body.md

          {
            echo "## Черновик релиза \`$tag\` готов"
            echo ""
            echo "Описание собрано из ноты «Что нового» и коммитов после предыдущего тега."
            echo "Остаётся проверить текст и нажать **Publish release** — тег создастся"
            echo "в этот момент, на текущем состоянии \`main\`."
            echo ""
            echo "${{ github.server_url }}/${{ github.repository }}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
