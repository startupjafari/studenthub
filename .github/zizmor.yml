# Настройка zizmor — линтера безопасности самих прогонов (job «Прогоны» в ci.yml).
#
# Переопределена одна политика: насколько жёстко пришпиливать версии экшенов.
#
# По умолчанию zizmor требует SHA для всего подряд. Для экшенов GitHub (actions/*,
# github/* — там живёт codeql-action) и Docker (docker/*) это избыточно: их теги двигают сами владельцы платформы и реестра,
# и угон тега там означал бы компрометацию куда большего, чем наш репозиторий. Зато
# читаемость прогона падает сразу — вместо `actions/checkout@v7` в файле стоит строка
# из сорока символов.
#
# Для всех остальных — SHA обязателен. Именно так в марте 2025 взломали
# tj-actions/changed-files: атакующий переписал теги, и все, кто ссылался на тег,
# получили чужой код следующим же прогоном. У нас в этой категории pnpm/action-setup
# и gitleaks/gitleaks-action — два экшена, которым мы отдаём токен и рабочий каталог.
#
# Версию рядом с SHA держит dependabot: он обновляет и хэш, и комментарий.
rules:
  unpinned-uses:
    config:
      policies:
        'actions/*': ref-pin
        'github/*': ref-pin
        'docker/*': ref-pin
        '*': hash-pin

  # Выключено до тех пор, пока actionlint не научится этому синтаксису.
  #
  # zizmor предлагает ссылаться на экшен из этого же репозитория новой формой `$/...`
  # вместо `./...`: она не зависит от состояния файловой системы раннера, то есть
  # предыдущий шаг не может подменить код экшена. Довод верный, но actionlint 1.7.12
  # такой формы ещё не знает и считает её ошибкой формата — то есть соседний шаг того же
  # job'а красит прогон. Выбирать между двумя линтерами смысла нет: оставляем `./` с
  # checkout, вернёмся, когда actionlint догонит.
  self-repository:
    disable: true

  # Единственное исключение — smoke.yml.
  #
  # zizmor прав в общем случае: `workflow_run` запускается в контексте базового
  # репозитория, с секретами и правом записи, и если такой прогон выкачивает код из
  # вызвавшего его запуска, атакующий исполняет свой код с нашими секретами. Это
  # классическая «pwn request».
  #
  # У нас обе предпосылки сняты:
  #   1. `branches: [main]` — триггер срабатывает только на прогонах по main, а туда
  #      попадает лишь то, что уже прошло ревью и мёрж. PR из форка сюда не доберётся;
  #   2. ни один шаг не выкачивает код вызвавшего запуска: у smoke checkout'а нет вовсе,
  #      у черновика релиза он без `ref`, то есть берёт ветку по умолчанию.
  #
  # Если когда-нибудь понадобится забрать код из вызвавшего прогона — это исключение
  # нужно снимать вместе с правкой, а не «потому что и так было выключено».
  dangerous-triggers:
    ignore:
      - smoke.yml
