# Конфиг gitleaks: правила по умолчанию плюс одно точечное исключение.
#
# Раньше конфига не было вовсе (в логе прогона — `no gitleaks config found in path
# .gitleaks.toml, using default gitleaks config`). Правило `generic-api-key` из набора по
# умолчанию ищет не известный формат ключа, а «литерал рядом со словом key/token/secret с
# высокой энтропией» — на это попадается обычный ключ строки из словаря.
#
# Проверять правки здесь той же версией, что ставит экшен в CI:
#   docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.24.3 detect --redact --no-banner -v

[extend]
# Правила по умолчанию (~170: AWS, GitHub PAT, приватные ключи и прочее) остаются в силе —
# мы их дополняем исключением, а не заменяем своим набором.
useDefault = true

# Пульт мини-аппа перечисляет периоды баннера как `{ minutes, key }`, где `key` — ключ
# строки из словаря (`MessageKey`), а не ключ доступа:
#
#   { minutes: 60 * 24 * 3, key: 'bannerPeriod3Days' }   apps/mini-app/src/screens/control.tsx
#
# Энтропия 3.6, рядом слово `key:` — generic-api-key считает это секретом. Правка кода тут
# не помогает: ночной прогон читает всю историю, а коммит от 21.09.2026 в ней остался и
# будет находиться всегда.
#
# Исключение описано по виду самого значения, а не по файлу: `paths` погасил бы в этом
# файле вообще все правила, включая настоящие форматы ключей. Под `^bannerPeriod…$` ключ
# доступа не подходит ни в одном формате.
#
# Сузить до «только это правило и только этот файл» не выйдет: в 8.24.3 — версия, которую
# ставит gitleaks-action@v3.0.0 — секция `[[allowlists]]`, а также поля `targetRules` и
# `matchCondition` внутри `[allowlist]` молча игнорируются (проверено: находка остаётся).
# Условия внутри `[allowlist]` соединяются по ИЛИ. Если версия обновится — исключение можно
# будет сузить, но сначала проверьте командой выше, что оно вообще применяется.
[allowlist]
description = "i18n-ключи периодов баннера в пульте мини-аппа — не ключи доступа"
regexes = ['''^bannerPeriod[A-Za-z0-9]+$''']
