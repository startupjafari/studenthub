name: StudentHub

options:
  bundleIdPrefix: kz.studenthub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    # `complete` включим отдельной задачей, когда появятся акторы сессии и сокета:
    # на пустом каркасе строгая проверка ничего не ловит, а шума даёт много.
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  StudentHub:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: StudentHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Обычный HTTPS — не предмет экспортного контроля. Без этого ключа каждая
        # сборка в App Store Connect ждёт ответа на вопрос о шифровании.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Адрес API приходит из xcconfig, а не из кода: у Debug и Release он разный.
        SHAPIBaseURL: $(API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.studenthub.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  StudentHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: StudentHub

schemes:
  StudentHub:
    build:
      targets:
        StudentHub: all
        StudentHubTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StudentHubTests
    archive:
      config: Release
