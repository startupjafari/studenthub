name: StudentHub

options:
  bundleIdPrefix: kz.studenthub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    # `complete` включим отдельной задачей, когда появятся акторы сессии и сокета:
    # на пустом каркасе строгая проверка ничего не ловит, а шума даёт много.
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

# Внешние зависимости. Каждая согласована отдельно (план, «Архитектурные решения»:
# строки со звёздочкой).
#
# `Package.resolved` в репозиторий не попадает: он лежит внутри .xcodeproj, а проект
# генерируется и не коммитится. Значит сборка берёт свежую версию в пределах мажора —
# понадобится воспроизводимость до патча, тут меняется `from` на `exactVersion`.
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.0"

targets:
  StudentHub:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: GRDB
        product: GRDB
      - package: SocketIO
        product: SocketIO
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: StudentHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Обычный HTTPS — не предмет экспортного контроля. Без этого ключа каждая
        # сборка в App Store Connect ждёт ответа на вопрос о шифровании.
        ITSAppUsesNonExemptEncryption: false
        # Своя схема для пушей и ссылок из веба: `studenthub://chats?c=…`.
        # Универсальные ссылки (https) появятся вместе с apple-app-site-association
        # на домене — до этого адрес веба открывает браузер, как и раньше.
        CFBundleURLTypes:
          - CFBundleURLName: kz.studenthub.app
            CFBundleURLSchemes:
              - studenthub
        # Камера нужна ровно для одного — отсканировать QR входа на компьютере.
        # Текст видит человек в системном запросе, поэтому в нём сказано зачем,
        # а не «приложению нужен доступ к камере».
        NSCameraUsageDescription: Чтобы отсканировать QR-код входа на компьютере.
        # Микрофон — только для голосовых сообщений в чате.
        NSMicrophoneUsageDescription: Чтобы записать голосовое сообщение.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Адрес API приходит из xcconfig, а не из кода: у Debug и Release он разный.
        SHAPIBaseURL: $(API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.studenthub.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  StudentHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: StudentHub

schemes:
  StudentHub:
    build:
      targets:
        StudentHub: all
        StudentHubTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StudentHubTests
    archive:
      config: Release
