# StudentHub — production-стек (docs/IMPLEMENTATION_PLAN.md 13.9).
# Запуск: docker compose -f docker/docker-compose.prod.yml --env-file docker/.env up -d --build
# Все сервисы restart: always; данные — в named volumes; TLS терминирует nginx.
# Миграции применяются ОТДЕЛЬНО до старта api (см. docs/RUNBOOK.md), не автоматически.

name: studenthub-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Docker Hub `minio/minio` больше не публикуется — официальный источник quay.io.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    expose: ['3001']

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    depends_on: [api]
    expose: ['3000']

  # Публичный сайт. От платформы не зависит вовсе — ни общего кода, ни общих данных
  # (docs/LANDING.md): если web лежит, лендинг продолжает отдаваться, а его редиректы на
  # платформу просто ведут в недоступный сервис. Поэтому depends_on здесь нет.
  #
  # NEXT_PUBLIC_* инлайнятся на этапе build, значит каждая правка адресов требует
  # пересборки образа, а не рестарта контейнера.
  landing:
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SALES_EMAIL: ${NEXT_PUBLIC_SALES_EMAIL}
    restart: always
    expose: ['3000']

  nginx:
    image: nginx:alpine
    restart: always
    depends_on: [web, api, landing]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro

volumes:
  pg_data:
  redis_data:
  minio_data:
  certbot_www:
