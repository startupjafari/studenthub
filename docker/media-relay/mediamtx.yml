# Медиа-ретранслятор камер StudentHub (README.md рядом, docs/PROJECT.md §3.10).
# Два входа: RTMPS :1936 от агентов и LL-HLS для браузеров; каждое подключение — с JWT
# от API на один путь `cam/<id>`. Ничего не записывается, видео живёт только в памяти.
# Адрес JWKS, порт HLS и origin веба задают переменные MTX_* поверх файла (entrypoint.sh).

logLevel: info

authMethod: jwt
authJWTJWKS: http://overridden-by-env/.well-known/media-jwks.json
authJWTIssuer: studenthub
authJWTAudience: studenthub-media
authJWTClaimKey: mediamtx_permissions

rtsp: false
rtmp: true
rtmpEncryption: strict
rtmpsAddress: :1936
rtmpServerKey: /certs/server.key
rtmpServerCert: /certs/server.crt

hls: true
hlsAddress: :8888
# Только origin веба: чужой сайт не встроит плеер с токеном пользователя.
hlsAllowOrigins: ['http://localhost:3000']
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
# Перестали смотреть — мультиплексор закрывается через 10 с, а не через минуту по умолчанию.
hlsMuxerCloseAfter: 10s

webrtc: false
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

pathDefaults:
  record: false

paths:
  # Только пути камер: `cam/<uuid>`. Всё прочее ретранслятор не примет даже с токеном.
  '~^cam/[0-9a-f-]{36}$': {}
