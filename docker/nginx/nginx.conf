# StudentHub — nginx прод-стека: терминирует TLS и раздаёт трафик по доменам.
#
# Здесь только http-уровень — то, что общее для всех сайтов. Сами домены и маршруты лежат
# в templates/default.conf.template: nginx прогоняет его через envsubst при старте, подставляя
# переменные SH_* из docker/.env. Так адреса задаются конфигурацией, а не правкой этого файла.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Через /api/ проходит не больше 10 файлов по 10 МБ: multipart у api ограничен
  # FILE_UPLOAD.DIRECT_UPLOAD_THRESHOLD_BYTES (apps/api/src/main.ts). Всё крупнее браузер
  # льёт presigned-ссылкой прямо в MinIO — тот сервер лимит снимает совсем.
  client_max_body_size 110m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # TLS настроен один раз на весь http-блок: серверов в шаблоне несколько, а политика у них
  # общая, и разъехаться она не должна.
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream studenthub_api      { server api:3001; }
  upstream studenthub_web      { server web:3000; }
  upstream studenthub_landing  { server landing:3000; }
  upstream studenthub_mini_app { server mini-app:8080; }
  upstream studenthub_minio    { server minio:9000; }

  # Отрендеренный шаблон (templates/default.conf.template → conf.d/default.conf).
  include /etc/nginx/conf.d/*.conf;
}
