# StudentHub — nginx reverse proxy (TLS termination, WS-upgrade, gzip).
# Терминирует TLS, проксирует / → web, /api → api, /socket.io → api (WebSocket).
# Сертификаты монтируются в /etc/nginx/certs (см. docker-compose.prod.yml).

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 110m;   # запас под видео 100 МБ (лимиты — на уровне API)

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream studenthub_api { server api:3001; }
  upstream studenthub_web { server web:3000; }

  # HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS задаётся здесь, а не в приложениях: это единственная точка терминации TLS.
    # Редирект с 80 на 443 без него защищает только тех, кто уже пришёл по http — первый
    # запрос по привычному адресу всё равно уходит открытым и его можно перехватить.
    # always — чтобы заголовок попадал и в ответы с ошибкой (301/404/5xx).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # REST API
    location /api/ {
      proxy_pass http://studenthub_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (socket.io) — upgrade
    location /socket.io/ {
      proxy_pass http://studenthub_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # Next.js (web) — всё остальное
    location / {
      proxy_pass http://studenthub_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
