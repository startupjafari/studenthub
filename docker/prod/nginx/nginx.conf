# StudentHub — nginx прод-стека: терминирует TLS и раздаёт трафик по доменам.
# Здесь только общий http-уровень; домены и маршруты — в templates/default.conf.template
# (SH_* из docker/prod/.env подставляет envsubst при старте).

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Через /api/ — до 10 файлов по 10 МБ (лимит multipart api); крупнее идёт мимо, прямо в
  # MinIO (docker/README.md, «Решения»).
  client_max_body_size 110m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # Политика TLS — одна на все серверы шаблона, чтобы не разъехалась.
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream studenthub_api      { server api:3001; }
  upstream studenthub_web      { server web:3000; }
  upstream studenthub_landing  { server landing:3000; }
  upstream studenthub_mini_app { server mini-app:8080; }
  upstream studenthub_minio    { server minio:9000; }

  # Отрендеренный шаблон (templates/default.conf.template → conf.d/default.conf).
  include /etc/nginx/conf.d/*.conf;
}
