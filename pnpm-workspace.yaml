packages:
  - 'apps/*'
  - 'packages/*'

# Выдержка перед установкой свежеопубликованной версии — 7 суток (10080 минут).
#
# Зачем нам. Подменённый пакет в npm обнаруживают не мгновенно: версию публикуют, её
# какое-то время скачивают, и только потом она попадает в advisory и исчезает из реестра.
# Неделя означает, что в это окно `pnpm install` не затянет её к нам — ни прямую
# зависимость, ни транзитивную. Та же величина, что `cooldown` у dependabot: обе выдержки
# про одно и то же, и расходиться им незачем.
#
# Почему здесь, а не в .npmrc: в pnpm 10 настройка читается только из этого файла —
# в .npmrc она молча игнорируется (проверено на 10.33.2).
#
# Побочный эффект, ради которого это и понадобилось: dependabot запускает
# `pnpm update ... -r --config.minimumReleaseAge=<cooldown>`, и шлагбаум проверяет всё
# дерево, а не только обновляемый пакет. Если в локе лежит транзитивная зависимость
# моложе окна, обновление обрывается целиком — так падали все прогоны npm_and_yarn.
# Пока лок собирается с той же выдержкой, спотыкаться не обо что.
#
# На `pnpm install --frozen-lockfile` не влияет: там версии не разрешаются заново.
# А вот `pnpm deploy` в apps/api/Dockerfile дерево разрешает, поэтому запускается с
# `--config.minimumReleaseAge=0` — почему это безопасно, расписано там же.
minimumReleaseAge: 10080

# Настройки ниже переехали сюда из поля `pnpm` в package.json: с pnpm 11 это поле
# больше не читается, причём молча — overrides просто перестали бы применяться.

# Находки, для которых совместимого обновления нет. (1) Транзитивные зависимости клиента minio —
# decode-uri-component через query-string и stream-json: minio 8.0.7 (последняя) по-прежнему
# делает require("stream-json/jsonl/Parser.js"), а в stream-json 3.5+ этого файла нет — с
# обновлением API не стартует (проверено распаковкой пакета). Снять, когда minio уедет с этих
# пакетов. (2) braces GHSA-vfj7-8cjw-p6xm: исправленной версии не существует вовсе — уязвимы все
# <=3.0.3, а 3.0.3 последняя; пакет приходит из сборочного инструментария @ducanh2912/next-pwa.
# Снять, когда выйдет патч.
auditConfig:
  ignoreGhsas:
    - GHSA-vcc3-ghjq-m6fr
    - GHSA-528h-pc64-c93x
    - GHSA-hqr4-qq8f-hg3x
    - GHSA-mjw6-4jj6-33hc
    - GHSA-vfj7-8cjw-p6xm

# Кому разрешено выполнять install-скрипты. В pnpm 11 список `onlyBuiltDependencies`
# заменён картой `allowBuilds`, и решение нужно принять по каждому пакету со скриптами:
# неразобранный пакет роняет установку с ERR_PNPM_IGNORED_BUILDS, а не проходит молча.
#
# `true` стоит у тех четырёх, что собирали нативную часть и под pnpm 10. Остальные при
# pnpm 10 в список не входили, то есть скрипты им уже не выполнялись, — `false` просто
# записывает это решение явно. Менять их на `true` без разбора, что именно делает скрипт,
# не нужно: лишний install-скрипт — это выполнение чужого кода на машине и в сборке.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  'bcrypt': true
  'prisma': true
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@sentry/cli': false
  '@swc/core': false
  'core-js-pure': false
  'esbuild': false
  'msgpackr-extract': false
  'unrs-resolver': false

# Нижние границы патчей для транзитивных зависимостей: закрывают уязвимости там, где
# прямого обновления нет. Каждая строка — конкретная находка аудита.
overrides:
  'fast-uri@^3': '^3.1.6'
  'fast-uri@^4': '^4.1.3'
  'find-my-way': '^9.7.0'
  'fastify': '^5.12.1'
  'js-yaml@^3': '^3.15.2'
  'js-yaml@^4': '^4.3.2'
  'brace-expansion@^1': '^1.1.18'
  'brace-expansion@^2': '^2.1.4'
  'serialize-javascript': '^7.1.2'
  'deepmerge-ts': '^8.0.0'
  'js-yaml@^5': '^5.2.2'
  'postcss': '^8.5.18'
  'nanoid@^3': '^3.3.18'
  '@fastify/static': '^10.1.1'
  'brace-expansion@^5': '^5.0.9'
  'axios': '^1.20.0'
  'undici@^7': '^7.29.1'
  '@nestjs/platform-fastify': '^11.2.4'
  'engine.io': '^6.6.10'
  'hono': '^4.12.34'
  'ip-address': '^10.5.1'
  'qs': '^6.16.0'
  '@fastify/busboy': '^3.2.2'
  'proxy-addr': '^2.0.8'
  '@modelcontextprotocol/sdk': '^1.31.0'
  'postcss-selector-parser': '^7.1.6'
  'fast-copy': '^4.1.1'
  'source-map-js': '^1.2.2'
